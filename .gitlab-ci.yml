image: 
  name: git3.nexdev.net:5050/rnd/testing/qc-auto-image
  # name: roshannguyen/pwimg

stages: 
  - test
  - report

test:
  stage: test
  tags:
    - docker-automation-test
  script:
    - echo $CI_PIPELINE_ID
    - npm install --no-optional
    - npm run CI_SelGame_$Mode --args=env=$env --game=$PRODUCT --lang=$lang
  artifacts:
    paths:
      - Report/$lang
    when: always
    expire_in: 1 day 


