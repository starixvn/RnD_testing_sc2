image: 
  name: git3.nexdev.net:5050/rnd/testing/qc-auto-image
  # name: roshannguyen/pwimg

stages: 
  - test
  - config-report
  - public-report
  - cleanup

test1:
  stage: test
  tags:
    - docker-automation-test
  script:
    - npm install --no-optional
    - echo "JOBR=$CI_JOB_ID" >> build.env
    - npm run CI_SelGame_$Mode --args=env=$env --game=$PRODUCT --lang=$lang
  artifacts:
    paths:
      - Report/$lang
      - build.env
    when: always
    expire_in: 1 day 


config_report:
  stage: config-report
  tags:
    - docker-automation-test
  script:
    - exit 0
  when: always 
  artifacts:
    reports:
      dotenv: 
        - build.env
    when: always
    expire_in: 1 day


public_report:
  stage: public-report
  tags:
    - docker-automation-test
  script:
    - npm install --no-optional
    - npm run sendResultToTelegram --args=Job=$JOBR-env=$env --lang=$lang
    - npm run exportStatus --args=env=$env
  when: always

cleanup_job:
  stage: cleanup
  tags:
    - docker-automation-test
  script:
    - echo "Cleaning up"
    - rm -rf "%CACHE_PATH%/%CI_PIPELINE_ID%"
  when: always
